apply plugin: 'com.android.application'

android {
    namespace 'com.retrorecomp.swiv'
    compileSdk 36
    ndkVersion '29.0.14206865'
    defaultConfig {
        applicationId 'com.retrorecomp.swiv'
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName '1.0'
        ndk { abiFilters 'arm64-v8a' }
        externalNativeBuild { cmake { arguments '-DANDROID_STL=c++_static', '-DANDROID_PLATFORM=android-26'; cppFlags '' } }
    }
    externalNativeBuild { cmake { path 'src/main/cpp/CMakeLists.txt'; version '4.4.2' } }
    buildTypes {
        release { minifyEnabled false; signingConfig signingConfigs.debug }
        debug { }
    }
    sourceSets { main { assets.srcDirs = ['src/main/assets'] } }
    packaging { jniLibs { useLegacyPackaging true } }
}
